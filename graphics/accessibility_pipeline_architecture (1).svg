</style>

<!-- Title -->
<text class="th" x="340" y="30" text-anchor="middle">Zielarchitektur: Barrierefreiheits-Assistenzpipeline</text>

<!-- BWEC Client -->
<rect x="230" y="55" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="77" text-anchor="middle" dominant-baseline="central">BWEC Client (React/TS)</text>

<!-- Three source arrows -->
<line x1="260" y1="99" x2="110" y2="145" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="99" x2="340" y2="145" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="99" x2="570" y2="145" class="arr" marker-end="url(#arrow)"/>

