<rect x="282" y="255" width="116" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="340" y="273" text-anchor="middle" dominant-baseline="central">Normalizer</text>
<rect x="512" y="255" width="116" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
