<line x1="340" y1="204" x2="340" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="570" y1="204" x2="570" y2="252" class="arr" marker-end="url(#arrow)"/>

<!-- Normalizers -->
<rect x="52" y="255" width="116" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
